name: CRM agent package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: crm-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: tools/crm-agent/pnpm-lock.yaml
      - name: Install isolated package
        run: pnpm --dir tools/crm-agent --ignore-workspace install --frozen-lockfile --ignore-scripts
      - name: Test, typecheck, and discover tools offline
        run: pnpm --dir tools/crm-agent --ignore-workspace check

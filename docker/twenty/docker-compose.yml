# Vendored from https://github.com/twentyhq/twenty
# (packages/twenty-docker/docker-compose.yml), adapted to pin every image tag
# to an explicit version instead of `latest` for reproducibility, and to
# widen the `server` healthcheck's start_period/retries (see the comment on
# that healthcheck below — live-verified against upstream's original values
# failing a cold start under load).
#
# Usage: docker compose -f docker/twenty/docker-compose.yml up -d
# Requires docker/twenty/.env (copy docker/twenty/.env.example and fill it in).
#
# Pinned Twenty release: v2.38.1
# (docker/twenty/README.md documents how to bump this tag deliberately.)
name: twenty

services:
  server:
    image: twentycrm/twenty:v2.38.1
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # start_period covers the server's first-boot migration run (182
      # legacy migrations observed on a fresh instance) without those
      # failing probes counting against `retries`. Live-verified: upstream's
      # original 5s/5s/20 (a 100s budget) let `docker compose up -d` report
      # `dependency failed to start: ... is unhealthy` on a loaded host even
      # though the server went healthy on its own ~3 minutes in — `up -d`
      # had already given up and returned by then.
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s
    restart: unless-stopped

  worker:
    image: twentycrm/twenty:v2.38.1
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DISABLE_DB_MIGRATIONS: "true" # the server service already runs migrations
      DISABLE_CRON_JOBS_REGISTRATION: "true" # the server service already registers cron jobs
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16.15
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  server-local-data:

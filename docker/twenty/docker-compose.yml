# Vendored from https://github.com/twentyhq/twenty
# (packages/twenty-docker/docker-compose.yml), adapted to pin every image tag
# to an explicit version instead of `latest` for reproducibility.
#
# Usage: docker compose -f docker/twenty/docker-compose.yml up -d
# Requires docker/twenty/.env (copy docker/twenty/.env.example and fill it in).
#
# Pinned Twenty release: v2.38.1
# (docker/twenty/README.md documents how to bump this tag deliberately.)
name: twenty

services:
  server:
    image: twentycrm/twenty:v2.38.1
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      # SERVER_BIND_HOST defaults to 0.0.0.0 (open, correct for local dev).
      # Production (PRODUCTION.md) sets SERVER_BIND_HOST=127.0.0.1 in its
      # .env so the port is reachable only through the host's own reverse
      # proxy — never edit this by hand on a live host with `sed`; that
      # fix does not survive the next time this file is re-copied from the
      # repo (confirmed: it silently reverted the VPS to an
      # internet-exposed port during a routine docker-compose.yml update).
      - "${SERVER_BIND_HOST:-0.0.0.0}:3000:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      # Cold start (fresh volume, first-ever migration run) has been
      # observed taking 100-180s — longer than retries*interval alone
      # covers. start_period gives that window a grace period so
      # `depends_on: condition: service_healthy` (the worker service,
      # and `docker compose up -d` itself) doesn't give up before the
      # server is actually ready. Without this, `pnpm twenty:setup`
      # reproducibly fails on a fresh install (confirmed both locally
      # and on a fresh VPS).
      start_period: 210s
    restart: unless-stopped

  worker:
    image: twentycrm/twenty:v2.38.1
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DISABLE_DB_MIGRATIONS: "true" # the server service already runs migrations
      DISABLE_CRON_JOBS_REGISTRATION: "true" # the server service already registers cron jobs
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16.15
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  server-local-data:

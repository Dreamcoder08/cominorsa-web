# ─── pnpm 11: control de build scripts por paquete ───────────────
# En pnpm 11+, los build scripts se controlan con `allowBuilds` aquí,
# NO con `onlyBuiltDependencies` en .npmrc.
# Solo los paquetes listados como `true` corren install scripts.
allowBuilds:
  sharp: true # binario nativo libvips — dep transitiva de wrangler>miniflare
  esbuild: true # bundler runtime — dep transitiva de wrangler
  workerd: true # runtime de Cloudflare Workers (wrangler)
  # Todo lo demás queda BLOQUEADO por seguridad.
  koffi: false
  protobufjs: false
  "@google/genai": false

# T11: `unrs-resolver` (dep de vite/vinext) removido de allowBuilds — ya
# no aparece en el lockfile una vez retirado el pipeline vinext/Vite.

minimumReleaseAgeExclude:
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0

# ─── Security overrides (pnpm 11+) ────────────────────────────────
# `overrides` en pnpm 11+ vive en pnpm-workspace.yaml, no en
# package.json#pnpm ni en .npmrc.
# esbuild >=0.25 elimina la vuln moderada GHSA-67mh-4wv8-2f99.
# sharp >=0.35.4 elimina las vulns high de libheif
# (GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545), que llegan como dev-only
# vía wrangler>miniflare>sharp.
overrides:
  esbuild: ">=0.25.0"
  sharp: ">=0.35.4"
